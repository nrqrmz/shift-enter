[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shift-enter"
version = "0.1.0"
description = "La plomeria de las notebooks de shift-enter"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "plotly",
    "pillow",
    "ipywidgets",
]

[tool.setuptools.packages.find]
include = ["shift_enter*"]

[tool.setuptools.package-data]
shift_enter = ["datos/*"]
